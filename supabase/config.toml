# Supabase local development config (supabase CLI). `supabase start` boots a local
# Postgres + Auth + Studio; `supabase db reset` applies migrations/ then seed.sql.
project_id = "trackpoli-platform"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local only. Set real site/redirect URLs per environment in the Supabase dashboard.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = false
