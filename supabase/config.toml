# Supabase local/CI configuration for TrackPoli. Hand-written for TP1-01 (no `supabase init` was run);
# validate on the first real `supabase start` and adjust keys the installed CLI version requires.
project_id = "trackpoli"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Postgres 17 (the Supabase CLI's current supported local version). The Phase 1 migrations and pgTAP
# suite were authored on PG 16; they are standard SQL + pgTAP and run on 17.
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000/admin"
additional_redirect_urls = ["http://localhost:3000/admin/auth/callback", "http://localhost:3000/admin/auth/confirm"]
# Invite-only: no public sign-up (NFR-S1). Accounts exist only after an invite.
enable_signup = false
enable_anonymous_sign_ins = false
# Access token lives 5 minutes (NFR-S5); idle/absolute limits are enforced in the app on the free plan.
jwt_expiry = 300
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Minimum 12 characters, no weakening composition rules (NFR-S2).
minimum_password_length = 12

[auth.email]
enable_confirmations = true
# Recovery/invite links are single-use and expire within 24h (NFR-S8); Supabase has one expiry setting.
# Supabase's default otp_expiry is 1h; we raise it to 24h (86400s, the max) so invite onboarding and
# recovery both stay usable within the shared window (ADR-0008). Validate the key on first `supabase start`.
otp_expiry = 86400
max_frequency = "1m"

# Recovery email (TP1-03, ADR-0008). Links to the /auth/confirm Continue page with the single-use
# token_hash; the password is never in the email. Template copy is in supabase/templates/recovery.html.
[auth.email.template.recovery]
subject = "Reset your TrackPoli Admin password"
content_path = "./supabase/templates/recovery.html"

# Invite email (TP1-09, P1-08). Sent by inviteUserByEmail when a manager invites an administrator. Like
# recovery, it links to the /auth/confirm Continue page with the single-use token_hash (type=invite), which
# exchanges the token on click and sends the person to /accept-invite. Copy is in supabase/templates/invite.html.
[auth.email.template.invite]
subject = "You've been invited to TrackPoli Admin"
content_path = "./supabase/templates/invite.html"

[auth.mfa]
# Two-factor (TOTP) required for every administrator (NFR-S6, Q-1-01).
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Custom Access Token Hook (migration 006): copies role/status into the token as app_role/app_status
# for UI routing only. The token is never the source of truth for access (RLS reads profiles live).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true

# Pre-authentication Edge Functions (TP1-02): called only by the TrackPoli server before a user has a
# session, so the Supabase gateway JWT check is off and the call is gated instead by INTERNAL_CALL_SECRET
# inside the handler (supabase/functions/_shared/auth.ts: assertInternalCall).
[functions.sign-in-check]
verify_jwt = false

[functions.auth-event]
verify_jwt = false

# request-password-reset (TP1-03): the forgot-password request runs before the user has a session, so the
# gateway JWT check is off and the call is gated by INTERNAL_CALL_SECRET (assertInternalCall) instead.
[functions.request-password-reset]
verify_jwt = false

# record-terms (TP1-08): a POST-authentication function — the signed-in administrator accepts the current
# terms/privacy at aal1 (before the two-factor code, migration 009). The gateway JWT check is ON, and the
# handler additionally gates with verifyCaller (allowInvited), deciding access from the profile, not a token
# claim (AGENTS.md).
[functions.record-terms]
verify_jwt = true

# Invite functions (TP1-09, P1-08). All POST-authentication, so the gateway JWT check is ON and each handler
# gates further with verifyCaller: invite-admin / resend-invite / revoke-invite are Administrator-Manager +
# aal2; complete-invite runs at aal1 with allowInvited (the caller is still 'invited' as they activate).
[functions.invite-admin]
verify_jwt = true

[functions.resend-invite]
verify_jwt = true

[functions.revoke-invite]
verify_jwt = true

[functions.complete-invite]
verify_jwt = true

# Admin-management functions (TP1-10, P1-13). All POST-authentication and Administrator-Manager + aal2, so
# the gateway JWT check is ON and each handler gates further with verifyCaller({ requireAal2: true }) plus a
# manager-role check. change-role / deactivate-admin / recreate-admin rely on the last-manager database guard
# (migration 002); deactivate and change-email revoke the target's sessions via revoke_user_sessions.
[functions.change-role]
verify_jwt = true

[functions.deactivate-admin]
verify_jwt = true

[functions.reactivate-admin]
verify_jwt = true

[functions.change-email]
verify_jwt = true

[functions.recreate-admin]
verify_jwt = true
