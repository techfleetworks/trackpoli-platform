# Staging deploy (TP1-02). Runs on merge to main: migrate the staging database expand-only (backward
# compatible — new columns/tables/functions, nothing destructive), deploy the Edge Functions, then deploy
# the app to Vercel. Expand-then-contract ordering means the running app never meets a schema it does not
# understand (release-deployment-safety). The contract phase (dropping anything old) is a separate change
# made only after a stable release.
#
# INERT UNTIL CONFIGURED: the deploy job SELF-SKIPS (its `if:` guard below) until the variable
# STAGING_SUPABASE_PROJECT_REF is set, so on an unconfigured repo this workflow stays neutral/green on every
# main push instead of erroring (previously `supabase db push --project-ref ""` failed, turning the 'staging'
# environment red). To enable staging, set the secrets (SUPABASE_ACCESS_TOKEN, STAGING_SUPABASE_DB_PASSWORD,
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) and the variable STAGING_SUPABASE_PROJECT_REF in the repo
# (Settings -> Secrets and variables -> Actions), and create the Vercel + staging Supabase projects. The job
# then runs automatically; no workflow edit is needed (ADR-0015, release-deployment-safety).
name: deploy-staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (staging)
    runs-on: ubuntu-latest
    environment: staging
    # Fail-closed-but-inert: skip the whole job (neutral, not failed) until staging is configured. Without the
    # project ref the first step (`supabase db push --project-ref ""`) errors and reds the 'staging'
    # environment on every main push. `vars` is readable in a job-level `if`, so a skipped job attempts no
    # deploy. deploy-staging is NOT a branch-protection required check (main is unprotected), so a skip blocks
    # nothing. Enable staging by setting STAGING_SUPABASE_PROJECT_REF. ADR-0015.
    if: ${{ vars.STAGING_SUPABASE_PROJECT_REF != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 1) Database first, expand-only, so the currently-running app keeps working during the rollout.
      - name: Apply migrations to staging (expand)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: supabase db push --project-ref "${{ vars.STAGING_SUPABASE_PROJECT_REF }}"

      - name: Deploy Edge Functions to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ vars.STAGING_SUPABASE_PROJECT_REF }}"

      # 2) Then the app.
      - name: Deploy app to Vercel (staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel build --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --token="$VERCEL_TOKEN"
