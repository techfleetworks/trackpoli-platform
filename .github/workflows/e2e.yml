# Browser end-to-end tests (TP1-02, TP1-07). Runs the credential-free suites with Playwright against
# `next dev` - no Supabase, no secrets - so they are reliable on every PR: the sign-in + recovery UI
# (e2e/sign-in.spec.ts, e2e/forgot-password.spec.ts) and the admin workspace shell (e2e/admin-shell.spec.ts,
# E2E-13 keyboard + E2E-14 axe, which run against the component gallery + shell demo). A second job runs the
# NFR-P1 Lighthouse budget against a production build of the shell. The full-stack lockout scenario (E2E-02)
# is gated on E2E_FULL_STACK and is added as a separate job once the local-Supabase + seed + Turnstile-test-
# key wiring is finalised (it needs CI iteration, like database.yml did). E2E-01 (2FA/dashboard) and E2E-16
# (Google) await later tickets / the production domain.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (sign-in UI + admin shell · E2E-13, E2E-14)
    runs-on: ubuntu-latest
    env:
      # The component gallery + shell demo are the credential-free targets for the admin-shell keyboard
      # (E2E-13) and axe (E2E-14) specs. They render freely under `next dev` (the gate in gallery/page.tsx
      # only hides them in a PRODUCTION build), so this flag is belt-and-braces here and documents intent;
      # it is REQUIRED by the lighthouse job below, which measures a production build.
      NEXT_PUBLIC_ENABLE_GALLERY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run UI e2e (sign-in + recovery + admin shell)
        run: npx playwright test e2e/sign-in.spec.ts e2e/forgot-password.spec.ts e2e/admin-shell.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # NFR-P1 performance budget (TP1-07, P1-12): "the shell loads and is interactive in 2.5s or less (LCP)".
  # check-lighthouse.mjs needs a RUNNING app + Chrome, so it cannot run in the dependency-free gates job. It
  # measures a PRODUCTION build (not `next dev`), so the gallery/shell demo must be opted in at BOTH build
  # and start with NEXT_PUBLIC_ENABLE_GALLERY=1 (the var is inlined at build time). ubuntu-latest ships
  # Google Chrome, which chrome-launcher auto-detects. Re-point lighthouse.config.json at real admin screens
  # as they land; like the full-stack job this may need CI iteration on first run.
  lighthouse:
    name: lighthouse (NFR-P1 · admin shell LCP)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ENABLE_GALLERY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (gallery enabled so the shell demo is reachable)
        run: npm run build
      - name: Start the production server and wait for it
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/admin/gallery/shell >/dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 2
          done
          echo "server did not become ready on :3000"; exit 1
      - name: Run the Lighthouse NFR-P1 budget check
        run: npm run check:lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-results
          path: reports/lighthouse-results.json
          retention-days: 7
          if-no-files-found: ignore

  # Full-stack lockout scenario (E2E-02): drives the real sign-in against a local Supabase stack (seed +
  # Edge Functions) with Cloudflare Turnstile TEST keys. MANUAL for now: the local-stack + functions-secrets
  # wiring below cannot be verified without Docker on a dev machine and WILL need CI iteration before it is
  # promoted to run on every PR, exactly like database.yml. The steps most likely to need adjustment are the
  # Edge Functions' secrets and reading the local anon/service-role keys from `supabase status`.
  e2e-full-stack:
    name: e2e (full stack · E2E-02, E2E-05, E2E-11)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      E2E_FULL_STACK: "1"
      INTERNAL_CALL_SECRET: e2e-internal-call-secret
      # Cloudflare Turnstile PUBLIC test keys — always pass; safe to commit.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Give the Edge Functions their local secrets
        run: |
          cat > supabase/functions/.env <<EOF
          INTERNAL_CALL_SECRET=${INTERNAL_CALL_SECRET}
          TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
          ALLOWED_ORIGINS=
          SITE_URL=http://localhost:3000/admin
          EOF
      - name: Start Supabase (DB + auth + functions) and seed
        run: |
          supabase start
          supabase db reset
      - name: Export the local anon + service-role keys for the app
        run: |
          supabase status -o env > supabase-status.env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(sed -n 's/^ANON_KEY=//p' supabase-status.env | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(sed -n 's/^SERVICE_ROLE_KEY=//p' supabase-status.env | tr -d '\"')" >> "$GITHUB_ENV"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # E2E-05 reads the recovery email from the local mail catcher (Inbucket/Mailpit) that `supabase start`
      # brings up; like E2E-02 this job is manual and will need CI iteration the first time.
      - name: Run the full-stack e2e (E2E-02 lockout + E2E-05 recovery + E2E-11 two-factor)
        run: npx playwright test e2e/sign-in.full-stack.spec.ts e2e/password-reset.full-stack.spec.ts e2e/two-factor.full-stack.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-full-stack
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
