# Browser end-to-end tests (TP1-02, TP1-07). Runs the credential-free suites with Playwright against
# `next dev` - no Supabase, no secrets - so they are reliable on every PR: the sign-in + recovery UI
# (e2e/sign-in.spec.ts, e2e/forgot-password.spec.ts) and the admin workspace shell (e2e/admin-shell.spec.ts,
# E2E-13 keyboard + E2E-14 axe, which run against the component gallery + shell demo). A second job runs the
# NFR-P1 Lighthouse budget against a production build of the shell. The full-stack lockout scenario (E2E-02)
# is gated on E2E_FULL_STACK and is added as a separate job once the local-Supabase + seed + Turnstile-test-
# key wiring is finalised (it needs CI iteration, like database.yml did). E2E-01 (2FA/dashboard) and E2E-16
# (Google) await later tickets / the production domain.
name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (sign-in UI + admin shell · E2E-13, E2E-14)
    runs-on: ubuntu-latest
    env:
      # The component gallery + shell demo are the credential-free targets for the admin-shell keyboard
      # (E2E-13) and axe (E2E-14) specs. They render freely under `next dev` (the gate in gallery/page.tsx
      # only hides them in a PRODUCTION build), so this flag is belt-and-braces here and documents intent;
      # it is REQUIRED by the lighthouse job below, which measures a production build.
      NEXT_PUBLIC_ENABLE_GALLERY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run UI e2e (sign-in + recovery + admin shell)
        run: npx playwright test e2e/sign-in.spec.ts e2e/forgot-password.spec.ts e2e/admin-shell.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # NFR-P1 performance budget (TP1-07, P1-12): "the shell loads and is interactive in 2.5s or less (LCP)".
  # check-lighthouse.mjs needs a RUNNING app + Chrome, so it cannot run in the dependency-free gates job. It
  # measures a PRODUCTION build (not `next dev`), so the gallery/shell demo must be opted in at BOTH build
  # and start with NEXT_PUBLIC_ENABLE_GALLERY=1 (the var is inlined at build time). Re-point
  # lighthouse.config.json at real admin screens as they land.
  #
  # STABILITY (ADR-0032): the gate must stay green on an unchanged build without weakening what it detects.
  # We do NOT rely on the runner's auto-detected, unpinned Google Chrome (it drifts between runs and its
  # version alone moves the trace and the score). Instead we install a FIXED Chrome-for-Testing build and
  # export CHROME_PATH; chrome-launcher honours CHROME_PATH, so no app change is needed. The script then runs
  # a deterministic simulate-throttled, median-of-5 measurement (see check-lighthouse.mjs / the config).
  lighthouse:
    name: lighthouse (NFR-P1 · admin shell LCP)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ENABLE_GALLERY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pin Chrome so the measurement browser does not drift. Action pinned to a commit SHA; chrome-version
      # pinned to an exact Chrome-for-Testing build (bump both deliberately, never float).
      - name: Pin Chrome (fixed version for a stable measurement)
        id: pin-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: "158.0.8127.36"
      - name: Export CHROME_PATH (chrome-launcher honours it)
        run: echo "CHROME_PATH=${{ steps.pin-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
      - name: Build (gallery enabled so the shell demo is reachable)
        run: npm run build
      - name: Start the production server and wait for it
        run: |
          npm run start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/admin/gallery/shell >/dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 2
          done
          echo "server did not become ready on :3000"; exit 1
      - name: Run the Lighthouse NFR-P1 budget check
        run: npm run check:lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-results
          path: reports/lighthouse-results.json
          retention-days: 7
          if-no-files-found: ignore

  # Full-stack scenarios (E2E-02 lockout, E2E-05 recovery, E2E-11 two-factor, E2E-18 security notices): drive
  # the real app and the Edge Functions against a local Supabase stack (seed + functions) with Cloudflare
  # Turnstile TEST keys. These are the executable acceptance checks for TP1-02/03/04/05/06/08/09/10/12, so the
  # job now runs on every PR (it was workflow_dispatch-only while the local-stack + functions-secrets wiring was
  # being iterated). It still runs no credentials: the keys are read from `supabase status` and Turnstile uses
  # the always-pass TEST keys. (E2E-18 proves the internal-only notice contract; the LIVE email-delivery check
  # stays domain-blocked — Q-1-21 — in docs/TODO.md until the Porkbun SMTP secrets exist.)
  e2e-full-stack:
    # Stable name (no embedded spec list): this is a *required* status check (see
    # .github/rulesets/e2e-acceptance.json + ADR-0033), and a required context that changes name silently
    # stops reporting and blocks every PR. The specs it runs are listed in the run step, not the job name.
    name: e2e (full stack)
    runs-on: ubuntu-latest
    env:
      E2E_FULL_STACK: "1"
      INTERNAL_CALL_SECRET: e2e-internal-call-secret
      # Cloudflare Turnstile PUBLIC test keys — always pass; safe to commit.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`: resolving "latest" calls the GitHub releases API, which is rate-limited on
          # shared runners and intermittently fails this step ("Failed to resolve latest Supabase CLI release:
          # rate limit exceeded"), leaving `supabase: command not found`. An exact version downloads the asset
          # directly with no API resolve, so this merge-blocking full-stack job is deterministic. Bump deliberately.
          version: 3.2.0
      - name: Give the Edge Functions their local secrets
        run: |
          cat > supabase/functions/.env <<EOF
          INTERNAL_CALL_SECRET=${INTERNAL_CALL_SECRET}
          TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
          ALLOWED_ORIGINS=
          SITE_URL=http://localhost:3000/admin
          EOF
      - name: Start Supabase (DB + auth + functions) and seed
        run: |
          supabase start
          supabase db reset
      - name: Export the local anon + service-role keys for the app
        run: |
          supabase status -o env > supabase-status.env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(sed -n 's/^ANON_KEY=//p' supabase-status.env | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(sed -n 's/^SERVICE_ROLE_KEY=//p' supabase-status.env | tr -d '\"')" >> "$GITHUB_ENV"
      # Layer the E2E-only fixtures on top of the base seed (ADR-0034): the dedicated manage-admins + accept-invite
      # people that the base seed.sql deliberately does NOT carry (its 7-person cast is coupled to the pgTAP count
      # invariants — 60_terms_gate, 20_guards). Applied here, AFTER `db reset`, so only this job gets them.
      - name: Load the E2E-only fixtures (dedicated manage-admins + accept-invite users)
        run: |
          DB_URL=$(sed -n 's/^DB_URL=//p' supabase-status.env | tr -d '"')
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/seed-e2e.sql
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # E2E-05 reads the recovery email from the local mail catcher (Inbucket/Mailpit) that `supabase start`
      # brings up; like E2E-02 this job is manual and will need CI iteration the first time.
      - name: Run the full-stack e2e (E2E-02 lockout + E2E-05 recovery + E2E-08 roles + E2E-09/10/17 manage-admins + E2E-11 two-factor + E2E-15 terms + E2E-03 invite + E2E-18 notices)
        # --workers=1 (serial): these are stateful full-stack specs sharing ONE seeded Supabase DB, and they
        # run against `next dev`. In parallel a slow spec starves the other worker, which made a sibling spec
        # sit long enough on a page for the real idle session-timeout (TP1-05) to fire mid-test. Serial removes
        # the contention and the cross-spec state races; reliability matters more than wall-clock here.
        run: npx playwright test --workers=1 e2e/sign-in.full-stack.spec.ts e2e/password-reset.full-stack.spec.ts e2e/role-based-access.full-stack.spec.ts e2e/manage-admins.full-stack.spec.ts e2e/two-factor.full-stack.spec.ts e2e/accept-terms.full-stack.spec.ts e2e/accept-invite.full-stack.spec.ts e2e/security-alert-emails.full-stack.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-full-stack
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # Safe-sessions scenarios (E2E-06 idle timeout, E2E-07 cross-tab sign-out; TP1-05, ADR-0010). SEPARATE job
  # because it shortens the session limits via env so the idle timeout fires in SECONDS — those short limits
  # would expire the other full-stack specs mid-run, so it cannot share the e2e-full-stack job. Same
  # credential-free local-stack setup; one spec, two tests that enrol abe / bea.
  e2e-full-stack-sessions:
    # Stable name (see the e2e-full-stack job above / ADR-0033): a required status check keeps a fixed
    # context so a future spec change cannot silently break the gate.
    name: e2e (full stack · safe sessions)
    runs-on: ubuntu-latest
    env:
      E2E_FULL_STACK: "1"
      INTERNAL_CALL_SECRET: e2e-internal-call-secret
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
      TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      # Shortened session limits (TP1-05 acceptance: "limits are config, not code"), read server-side by
      # src/lib/config.ts and passed to the client by the layout, so the idle warning + timeout fire in seconds.
      SESSION_IDLE_MS: "6000"
      SESSION_WARN_LEAD_MS: "3000"
      SESSION_ACTIVITY_PING_MS: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`: resolving "latest" calls the GitHub releases API, which is rate-limited on
          # shared runners and intermittently fails this step ("Failed to resolve latest Supabase CLI release:
          # rate limit exceeded"), leaving `supabase: command not found`. An exact version downloads the asset
          # directly with no API resolve, so this merge-blocking full-stack job is deterministic. Bump deliberately.
          version: 3.2.0
      - name: Give the Edge Functions their local secrets
        run: |
          cat > supabase/functions/.env <<EOF
          INTERNAL_CALL_SECRET=${INTERNAL_CALL_SECRET}
          TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
          ALLOWED_ORIGINS=
          SITE_URL=http://localhost:3000/admin
          EOF
      - name: Start Supabase (DB + auth + functions) and seed
        run: |
          supabase start
          supabase db reset
      - name: Export the local anon + service-role keys for the app
        run: |
          supabase status -o env > supabase-status.env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(sed -n 's/^ANON_KEY=//p' supabase-status.env | tr -d '\"')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(sed -n 's/^SERVICE_ROLE_KEY=//p' supabase-status.env | tr -d '\"')" >> "$GITHUB_ENV"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run the safe-sessions e2e (E2E-06 idle timeout + E2E-07 cross-tab sign-out)
        run: npx playwright test --workers=1 e2e/safe-sessions.full-stack.spec.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-full-stack-sessions
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
