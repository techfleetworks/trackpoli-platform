# App-code PR checks for TrackPoli (TP1-02). One required status check per concern, so the PR shows a
# green tick for each: lint, typecheck, unit tests, bundle size, dependency vulnerabilities, and leaked
# secrets. These run with no external credentials. The enterprise-skill gates live in gates.yml; the
# database proof in database.yml; the browser end-to-end run in e2e.yml (added with the Playwright tests).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint
            run: npm run lint
          - name: typecheck
            run: npm run typecheck
          - name: unit
            run: npm run test:unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  bundle-size:
    name: check (bundle-size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Bundle size within budget
        run: npm run check:bundle

  dependencies:
    name: check (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Dependency vulnerability scan (fail on high or critical in shipped deps)
        run: npm audit --audit-level=high --omit=dev

  secrets:
    name: check (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --no-git --source . --redact --no-banner --config .gitleaks.toml
